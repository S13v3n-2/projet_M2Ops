id: gazette_controle_qualite
namespace: gazette

description: |
  Contrôle qualité : se déclenche à la fin réussie de gazette_clear_article.
  Vérifie trois faits sur les articles propres et les rejets du jour : aucune date
  future, aucun titre vide, taux de rejet de chaque source inférieur ou égal à 80 %.
  Un contrôle en échec fait sortir le conteneur en code 1, l'exécution passe en FAILED.
  L'étape tourne dans un conteneur de l'image gazette:local
  (docker compose --profile build build).

tasks:
  - id: controle_qualite
    type: io.kestra.plugin.docker.Run
    containerImage: gazette:local
    pullPolicy: NEVER
    commands:
      - python
      - -m
      - la_gazette_des_sorciers.controles_qualite
    networkMode: gazette
    env:
      DATABASE_URL: "{{ envs.database_url }}"
      S3_ENABLED: "{{ envs.s3_enabled }}"
      S3_ENDPOINT_URL: "{{ envs.s3_endpoint_url }}"
      S3_BUCKET: "{{ envs.s3_bucket }}"
      S3_REGION: "{{ envs.s3_region }}"
      AWS_ACCESS_KEY_ID: "{{ envs.aws_access_key_id }}"
      AWS_SECRET_ACCESS_KEY: "{{ envs.aws_secret_access_key }}"

triggers:
  - id: apres-nettoyage
    type: io.kestra.plugin.core.trigger.Flow
    dependsOn:
      - namespace: gazette
        flowId: gazette_clear_article
        states: [SUCCESS]
