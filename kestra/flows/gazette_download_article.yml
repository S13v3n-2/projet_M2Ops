id: gazette_download_article
namespace: gazette

description: |
  Collecte des flux RSS (XML brut + JSON) vers le bronze.
  Le nettoyage n'est plus dans ce flow : gazette_clear_article se declenche
  a la fin réussie de la collecte.
  Chaque étape tourne dans un conteneur de l'image gazette:local
  (docker compose --profile build build).

tasks:
  - id: collecte_xml
    type: io.kestra.plugin.docker.Run
    containerImage: gazette:local
    pullPolicy: NEVER
    commands:
      - python
      - -m
      - la_gazette_des_sorciers.collecte_xml
    networkMode: gazette
    env:
      DATABASE_URL: "{{ envs.database_url }}"
      S3_ENABLED: "{{ envs.s3_enabled }}"
      S3_ENDPOINT_URL: "{{ envs.s3_endpoint_url }}"
      S3_BUCKET: "{{ envs.s3_bucket }}"
      S3_REGION: "{{ envs.s3_region }}"
      AWS_ACCESS_KEY_ID: "{{ envs.aws_access_key_id }}"
      AWS_SECRET_ACCESS_KEY: "{{ envs.aws_secret_access_key }}"
    volumes:
      - "{{ envs.data_dir }}:/data"

  - id: collecte_json
    type: io.kestra.plugin.docker.Run
    containerImage: gazette:local
    pullPolicy: NEVER
    commands:
      - python
      - -m
      - la_gazette_des_sorciers.collecte_json
    networkMode: gazette
    env:
      DATABASE_URL: "{{ envs.database_url }}"
      S3_ENABLED: "{{ envs.s3_enabled }}"
      S3_ENDPOINT_URL: "{{ envs.s3_endpoint_url }}"
      S3_BUCKET: "{{ envs.s3_bucket }}"
      S3_REGION: "{{ envs.s3_region }}"
      AWS_ACCESS_KEY_ID: "{{ envs.aws_access_key_id }}"
      AWS_SECRET_ACCESS_KEY: "{{ envs.aws_secret_access_key }}"
    volumes:
      - "{{ envs.data_dir }}:/data"

triggers:
  - id: tous-les-30M
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0,30 * * * *"
    #cron: "/30 * * * *"
    timezone: Europe/Paris
