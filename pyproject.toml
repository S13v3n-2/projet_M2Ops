[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "la_gazette_des_sorciers"
version = "0.1.0"
description = "Pipeline de gazette matinale automatisée"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "requests>=2.0",
  "xmltodict>=1.0",
  "python-dotenv>=1.0",
  "boto3>=1.35,<2",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0",
  "ruff>=0.17",
  "pip-tools>=7.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# par défaut seuls les tests unitaires tournent, -m integration ou -m e2e pour les autres
addopts = "-m 'not integration and not e2e'"
markers = [
  "unit: test unitaire, sans service externe (marqueur ajouté automatiquement)",
  "integration: nécessite PostgreSQL et un serveur S3 réels (DATABASE_URL, S3_*)",
  "e2e: vérifie le résultat d'une collecte réelle sur la stack docker compose",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",    # erreurs de style (pycodestyle)
  "F",    # erreurs logiques (imports inutilisés, noms indéfinis)
  "I",    # tri des imports (isort)
  "UP",   # modernisation de la syntaxe (pyupgrade)
  "B",    # pièges courants (bugbear)
]

[tool.ruff.format]
quote-style = "double"
