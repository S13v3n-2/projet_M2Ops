name: secrets

# détection de clés, mots de passe et tokens dans le code et l'historique git
on:
  push:
  pull_request:
    branches: [develop, main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          # tout l'historique, un secret supprimé plus tard reste lisible dans git
          fetch-depth: 0
      - name: installation de gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -O "${base}/${archive}"
          curl -sSfL -O "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${archive}" gitleaks
      - name: scan du dépôt
        run: ./gitleaks git . --config .gitleaks.toml --redact --verbose --exit-code 1
