name: nightly

# collecte réelle sur la stack docker compose, la nuit et à la demande
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # identifiants jetables, la stack n'existe que le temps du job
      COMPOSE_PROFILES: local
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci-password
      POSTGRES_DB: gazette_ci
      DATABASE_URL: postgresql+psycopg2://ci:ci-password@localhost:5432/gazette_ci
      S3_ENABLED: "true"
      S3_ENDPOINT_URL: http://127.0.0.1:9000
      S3_BUCKET: gazette-bronze
      S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ci-access-key
      AWS_SECRET_ACCESS_KEY: ci-secret-key-0123
      # requis par l'interpolation du compose, Kestra n'est pas démarré ici
      DATA_DIR_HOST: /tmp/gazette-data
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
      - name: Set up Python 12
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - name: install requirements
        run: python -m pip install -r requirements-dev.txt
      - name: installation de la_gazette_des_sorciers
        run: pip install --no-deps .
      - name: image des scripts
        run: docker compose --profile build build
      - name: démarrage de la base et du data lake
        run: |
          docker compose up -d db rustfs
          for i in $(seq 1 30); do
            docker compose exec -T db pg_isready -U ci -d gazette_ci \
              && curl -s -o /dev/null --max-time 2 http://127.0.0.1:9000 && exit 0
            sleep 2
          done
          docker compose ps
          exit 1
      - name: migrations et import des sources
        run: |
          alembic upgrade head
          python -m la_gazette_des_sorciers.database.import_sources
      - name: collecte (image gazette, comme dans Kestra)
        # une source en échec ne doit pas masquer le verdict des tests e2e
        continue-on-error: true
        run: |
          for module in collecte_xml collecte_json; do
            docker run --rm --network gazette \
              -e DATABASE_URL=postgresql+psycopg2://ci:ci-password@db:5432/gazette_ci \
              -e S3_ENABLED=true -e S3_ENDPOINT_URL=http://rustfs:9000 \
              -e S3_BUCKET -e S3_REGION -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY \
              gazette:local python -m la_gazette_des_sorciers.$module
          done
      - name: verification du bucket et de la base
        run: python -m pytest -m e2e -v
      - name: logs des services en cas d'échec
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: arrêt de la stack
        if: always()
        run: docker compose down -v
