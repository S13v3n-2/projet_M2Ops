name: integration

# tests d'intégration sur PostgreSQL et RustFS réels, avant de fusionner
on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

env:
  # identifiants jetables, valables uniquement pour ce job
  DATABASE_URL: postgresql+psycopg2://ci:ci-password@localhost:5432/gazette_ci
  S3_ENABLED: "true"
  S3_ENDPOINT_URL: http://127.0.0.1:9000
  S3_REGION: us-east-1
  AWS_ACCESS_KEY_ID: ci-access-key
  AWS_SECRET_ACCESS_KEY: ci-secret-key-0123

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: gazette_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d gazette_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rustfs:
        image: rustfs/rustfs:1.0.5
        env:
          RUSTFS_VOLUMES: /data
          RUSTFS_ADDRESS: 0.0.0.0:9000
          RUSTFS_ACCESS_KEY: ci-access-key
          RUSTFS_SECRET_KEY: ci-secret-key-0123
        ports:
          - 9000:9000
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
      - name: Set up Python 12
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - name: install requirements
        run: python -m pip install -r requirements-dev.txt
      - name: installation de la_gazette_des_sorciers
        run: pip install --no-deps .
      - name: attente de RustFS
        run: |
          for i in $(seq 1 30); do
            curl -s -o /dev/null --max-time 2 http://127.0.0.1:9000 && exit 0
            sleep 2
          done
          echo "RustFS ne répond pas" && exit 1
      - name: tests d'intégration
        run: python -m pytest -m integration -v
